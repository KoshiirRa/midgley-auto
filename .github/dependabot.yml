# Dependabot Configuration for Midgley Auto (Android Automotive OS / Android Auto)
version: 2
updates:
  # Gradle Dependencies (AndroidX Car App Library, Compose, Kotlin, OkHttp, Retrofit)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # GitHub Actions Workflow Dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      actions-workflows:
        patterns:
          - "*"
    open-pull-requests-limit: 5
