# Dependabot Configuration for Midgley Auto (Android Automotive OS / Android Auto)
version: 2
updates:
  # Gradle Dependencies (AndroidX Car App Library, Compose, Kotlin, OkHttp, Retrofit)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      # Block upgrades requiring compileSdk 37+ (Issue #13)
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.retrofit2:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.core:core*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.compose.ui:*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # GitHub Actions Workflow Dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      actions-workflows:
        patterns:
          - "*"
    open-pull-requests-limit: 5
